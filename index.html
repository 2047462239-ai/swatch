let memoryOnly=false;
function readState(){try{const saved=JSON.parse(localStorage.getItem(STORE)||'null');if(saved&&saved.version===2&&saved.accounts&&saved.accounts.lin&&saved.accounts.qiao&&saved.accounts[saved.active]&&Array.isArray(saved.accounts.lin.records)&&Array.isArray(saved.accounts.qiao.records))return saved;}catch(e){memoryOnly=true;}return initialState();}
let state=readState();

const records=()=>acct().records;
const byId=id=>records().find(r=>r.id===id);
const sortedRecords=()=>[...records()].sort((a,b)=>String(b.updated).localeCompare(String(a.updated)));
function persist(){try{localStorage.setItem(STORE,JSON.stringify(state));}catch(e){memoryOnly=true;}}
let toastTimer;

function header(title,right='',brand=false){return `<header class="topbar"><button class="icon-btn back-icon" data-action="back" aria-label="返回上一页">${ic('back')}</button><h1 class="${brand?'title-brand':''}">${title}</h1>${right||'<span></span>'}</header>`;}

function filteredRecords(){const q=filters.query.trim().toLowerCase();return sortedRecords().filter(r=>(filters.status==='全部'||r.status===filters.status)&&(filters.part==='全部部位'||r.part===filters.part)&&(filters.light==='全部光线'||r.light===filters.light)&&(!q||`${r.brand} ${r.series} ${r.shade}`.toLowerCase().includes(q)));}
function archivePage(picker=false){const list=picker?sortedRecords():filteredRecords();return `${header(picker?'选择对比档案':'试色档案',picker?'':`<button class="right-action" data-action="toggle-selection">${selecting?'取消多选':'对比多选'}</button>`)}<div class="page-intro"><p>${picker?'选择 2—4 条试色记录':`<span id="archiveCount">${list.length}</span> 份属于自己的色彩`}</p><span class="private-label">${ic('lock')}默认私密</span></div>${picker?'':`<div class="archive-search"><label class="search-box">${ic('search')}<input id="archiveSearch" type="search" aria-label="在档案中搜索" placeholder="搜索品牌、系列或色号" value="${esc(filters.query)}" autocomplete="off" enterkeyhint="search"></label></div><div class="status-tabs" role="group" aria-label="产品状态筛选">${['全部','已拥有','待购买','试过未买'].map(s=>`<button class="filter-chip${filters.status===s?' active':''}" aria-pressed="${filters.status===s}" data-action="filter-status" data-value="${s}">${s}</button>`).join('')}</div><div class="condition-filters"><button class="condition-button" data-action="filter-part"><span>部位：${filters.part==='全部部位'?'全部':filters.part}</span>${ic('down')}</button><button class="condition-button" data-action="filter-light"><span>光线：${filters.light==='全部光线'?'全部':filters.light}</span>${ic('down')}</button></div>`}<div class="record-grid" id="recordGrid">${list.length?list.map(r=>recordCard(r,picker||selecting)).join(''):empty('暂时没有符合的试色','换个关键词，或重置筛选再看看。')}</div><p class="list-footer-note">${picker?'不同光线与部位会影响颜色，请保留比较条件。':'所有图片和品牌信息均为模拟示例'}</p>`;}
function detailPage(r){if(!r)return missingPage();return `${header('试色详情')}<div class="hierarchy-note"><span>试色档案</span>${ic('chevron')}<span>我的试色记录</span></div><div class="detail-photo">${imageMarkup(r,'')}${privateMark()}<span class="image-ai">AI 生成 · 示例试色</span></div><div class="detail-title"><p class="brand">${esc(r.brand)}</p><div class="detail-title-row"><div><h2>${esc(r.shade)}</h2><p class="series">${esc(r.series)}</p></div><button class="heart-btn ${r.favorite?'favorited':''}" data-action="favorite" data-id="${r.id}" aria-label="${r.favorite?'取消收藏':'加入收藏'}" aria-pressed="${r.favorite}">${ic('heart')}</button></div>${statusPill(r)}</div><div class="content"><section class="condition-card soft-card" aria-label="拍摄条件">${[['sun','拍摄光线',r.light],['brush','试色部位',r.part],['lipstick','涂抹方式',r.finish]].map(([icon,title,value])=>`<div class="condition-cell">${ic(icon)}<p>${title}</p><strong>${esc(value)}</strong></div>`).join('')}</section><section class="notes-card soft-card"><h2 class="card-title">${ic('note')}个人使用感受</h2><p>${acct().prefs.hideNotes?'使用感受已隐藏，可在隐私设置中恢复展示。':esc(r.notes||'这条记录还没有补充感受，可以点击编辑记录写下来。')}</p><div class="record-date"><span>记录于 ${esc(r.created.slice(0,10).replace(/-/g,'.'))}</span><span>仅自己可见</span></div></section><div class="detail-actions"><button class="secondary" data-route="/edit/${r.id}">${ic('edit')}编辑记录</button><button class="primary" data-action="compare-record" data-id="${r.id}">${ic('compare')}加入对比</button></div><button class="back-list-button" data-action="favorite" data-id="${r.id}">${ic('heart')}${r.favorite?'已收藏 · 点击取消':'加入我的收藏'}</button><p class="form-warning">AI 图片、品牌及色号仅用于原型演示。<br>照片受设备和光线影响，请以实际试用感受为准。</p></div>`;}
function comparePage(){ensureCompare();const items=selected.map(byId).filter(Boolean);const diff=new Set(items.map(r=>r.light)).size>1;return `${header('并排试色对比')}<div class="hierarchy-note"><span>试色档案</span>${ic('chevron')}<span>试色详情</span>${ic('chevron')}<span>并排对比</span></div><div class="compare-explain ${diff?'':'same'}">${ic('sun')}<span>${diff?'拍摄光线不同，已用颜色标签区分。建议优先比较相同光线、部位和涂抹方式的记录。':'这些记录的光线标签相同，也请留意试色部位和涂抹方式的差别。'}</span></div><div class="compare-scroll"><div class="compare-grid">${items.map(r=>`<article class="compare-column"><div class="record-image-wrap">${imageMarkup(r,'') }<span class="image-ai">AI 示例</span></div><div class="compare-column-top"><p>${esc(r.brand)}</p><h3>${esc(r.shade)}</h3>${statusPill(r)}</div><div class="compare-row light-${lightMap[r.light]}"><p>拍摄光线</p>${lightPill(r)}</div><div class="compare-row"><p>试色部位</p><strong>${r.part}</strong></div><div class="compare-row"><p>涂抹方式</p><strong>${r.finish}</strong></div><div class="compare-row notes"><p>个人使用感受</p><div>${acct().prefs.hideNotes?'使用感受已隐藏':esc(r.notes)}</div></div></article>`).join('')}</div></div><p class="compare-hint">${items.length} 条记录并排展示${items.length>2?' · 左右滑动查看':''}</p><div class="compare-footer"><button class="secondary" data-route="/compare/select">替换对比内容</button><button class="primary" data-action="return-archives">返回档案列表</button></div><div class="compare-summary"><p>颜色相近，也可能有不同的使用感受。<br>回看已有产品，让每次购买更有依据。</p></div>`;}
function ensureCompare(){selected=selected.filter(id=>byId(id)).slice(0,4);for(const r of sortedRecords()){if(selected.length>=2)break;if(!selected.includes(r.id))selected.push(r.id);}}
function choices(name,values,value){return `<div class="choice-row" role="group" aria-label="${name}">${values.map(v=>`<button type="button" class="choice" data-action="form-choice" data-name="${name}" data-value="${v}" aria-pressed="${v===value}">${v}</button>`).join('')}<input type="hidden" name="${name}" value="${esc(value)}"></div>`;}
function defaultForm(){return {brand:'花序 HUA XU',series:'空气柔雾唇釉',shade:'R09 温柔玫瑰',status:'已拥有',light:'自然光',part:'上唇',finish:'薄涂',image:'lip_rose',notes:'薄涂温柔自然，适合日常通勤。先在自然光下记录，再补充实际使用感受。'};}
function formValues(id){return formTemp[state.active+':'+(id||'new')]||(id?byId(id):acct().draft)||defaultForm();}
function newPage(id){const v=formValues(id);if(id&&!byId(id))return missingPage();return `${header(id?'编辑试色记录':'新建试色记录')}<div class="page-intro"><p>${id?'更新这一次试色的细节':'把今天试过的颜色，好好留下'}</p><span class="private-label">${ic('lock')}默认私密</span></div>${!id&&acct().draft?'<div class="draft-banner"><span>已恢复这个账号保存的草稿</span><button data-action="discard-draft">重新填写</button></div>':''}<form id="recordForm" data-id="${id||''}" novalidate><div class="form-block"><div class="form-caption">试色照片<span>AI 示例图库</span></div><button class="photo-picker" type="button" data-action="choose-photo" aria-label="选择示例试色照片"><img id="formPhoto" src="${photo(v.image)}" alt="当前AI示例试色照片"><span class="photo-edit">${ic('camera')}更换示例照片</span></button><input type="hidden" name="image" value="${esc(v.image)}"></div><div class="form-block"><div class="form-caption">产品信息<span>品牌和色号必填</span></div><div class="form-fields">${[['brand','品牌','例如：花序 HUA XU',24],['series','产品系列','例如：空气柔雾唇釉',30],['shade','色号名称','例如：R09 温柔玫瑰',30]].map(([name,label,placeholder,max])=>`<label class="field"><span>${label}</span><input name="${name}" value="${esc(v[name])}" placeholder="${placeholder}" maxlength="${max}" autocomplete="off" aria-label="${label}" ${name!=='series'?'required':''}></label>`).join('')}</div><div class="duplicate-tip" id="duplicateTip"></div></div><div class="form-block"><div class="form-caption">产品状态</div>${choices('status',['已拥有','待购买','试过未买'],v.status)}</div><div class="form-block"><div class="form-caption">拍摄条件</div><div class="condition-form"><div class="form-caption">拍摄光线</div>${choices('light',['自然光','室内暖光','冷白光'],v.light)}<div class="form-caption">试色部位</div>${choices('part',['上唇','手臂'],v.part)}<div class="form-caption">涂抹方式</div>${choices('finish',['薄涂','厚涂'],v.finish)}</div></div><div class="form-block"><label class="form-caption" for="notes">个人使用感受<span>最多 500 字</span></label><textarea class="note-input" id="notes" name="notes" maxlength="500" placeholder="写下颜色、质地、舒适度和适合的场景…">${esc(v.notes)}</textarea><div class="form-actions"><button class="secondary" type="button" data-action="save-draft">保存草稿</button><button class="primary" type="submit">${id?'保存修改':'确认保存'}</button></div><p class="form-warning">仅保存在当前设备的浏览器中，档案默认为私密。<br>本页使用 AI 示例照片，不上传真实图片。</p></div></form>`;}
function mePage(){const a=acct();return `${header('我的',`<button class="right-action" data-route="/settings">设置</button>`)}<section class="profile-head"><div class="profile-person"><img class="avatar ${state.active==='qiao'?'alt':''}" src="${photo('avatar')}" alt="AI生成的模拟用户头像"><div><h2 class="profile-name">${esc(a.name)}</h2><p>${esc(a.bio)}</p><span class="badge-soft" style="display:inline-block;margin-top:7px">模拟体验账号</span></div></div><div class="profile-stats">${[['/archives',a.records.length,'我的档案'],['/favorites',a.records.filter(r=>r.favorite).length,'我的收藏'],['/history',a.history.filter(h=>byId(h.id)).length,'浏览记录']].map(([route,n,label])=>`<button class="stat-button" data-route="${route}"><strong>${n}</strong><span>${label}</span></button>`).join('')}</div></section><div class="content"><div class="menu-card soft-card">${menuItem('/favorites','heart','我的收藏',`${a.records.filter(r=>r.favorite).length} 条`)}${menuItem('/history','history','浏览记录')}${menuItem('/export','download','数据导出','备份档案')}</div><div class="menu-card soft-card">${menuItem('/settings','settings','账号设置')}${menuItem('/privacy','shield','隐私设置','默认私密')}${menuItem('/help','help','帮助与反馈')}${menuItem('/accounts','switch','切换模拟账号','2 个测试账号')}</div><div class="menu-card soft-card"><button class="menu-item logout" data-action="logout">${ic('logout')}退出登录</button></div><p class="profile-note">试色记 · 个人美妆试色档案工具<br>所有示例素材均为 AI 生成，无公开分享功能。</p></div>`;}
function menuItem(route,icon,label,right=''){return `<button class="menu-item" data-route="${route}">${ic(icon)}<span class="menu-title">${label}</span>${right?`<span class="menu-right">${right}</span>`:''}${ic('chevron')}</button>`;}
function collectionPage(type){const favorite=type==='favorites';const list=favorite?sortedRecords().filter(r=>r.favorite):acct().history.map(h=>byId(h.id)).filter(Boolean);return `${header(favorite?'我的收藏':'浏览记录')}<div class="page-intro"><p>${favorite?'喜欢的色彩，随时回来看看':'最近回看过的个人试色'}</p><span class="private-label">${ic('lock')}仅自己可见</span></div><p class="history-date">共 ${list.length} 条${favorite?'收藏':'记录'}</p><div class="record-grid">${list.length?list.map(r=>recordCard(r)).join(''):empty(favorite?'还没有收藏的试色':'这里会留下你的浏览记录',favorite?'进入试色详情，轻点爱心即可收藏。':'打开一条自己的试色档案，就会出现在这里。','return-archives','去看看档案')}</div>`;}
function settingsPage(){return `${header('账号设置')}<div class="settings-section"><p class="settings-label">个人资料</p><div>${settingsRow('昵称',esc(acct().name),'edit-name')}${settingsRow('当前账号',state.active==='lin'?'林知夏的模拟账号':'乔念的模拟账号','open-accounts')}${settingsRow('头像','AI 生成示例','avatar-info')}</div><p class="settings-label">使用偏好</p><button class="settings-row" data-action="toggle-pref" data-key="rememberForm" aria-pressed="${acct().prefs.rememberForm}"><div class="settings-main"><h3>保留未保存的表单</h3><p>在页面间切换时，保留本次填写内容</p></div><span class="switch ${acct().prefs.rememberForm?'on':''}"></span></button><p class="settings-label">关于试色记</p><div>${settingsRow('版本','课程交互原型 2.0','about')}${settingsRow('数据保存','当前设备浏览器','storage-info')}</div><p class="account-description">示例品牌、色号与试色图片仅用于界面演示，不构成产品推荐。</p></div>`;}
function settingsRow(label,value,action){return `<button class="settings-row" data-action="${action}"><div class="settings-main"><h3>${label}</h3></div><span class="settings-value">${value}</span>${ic('chevron',true)}</button>`;}
function privacyPage(){return `${header('隐私设置')}<div class="content"><div class="privacy-intro"><div class="privacy-emblem">${ic('shield')}</div><h2>自己的记录，安心私藏</h2><p>所有试色档案默认私密。<br>这里没有公开主页，也没有社交分享流。</p></div><div class="soft-card">${settingsRow('档案访问范围','仅自己可见','private-info')}<button class="settings-row" data-action="toggle-pref" data-key="hideNotes" aria-pressed="${acct().prefs.hideNotes}"><div class="settings-main"><h3>隐藏使用感受</h3><p>在详情和对比页面暂时隐藏笔记</p></div><span class="switch ${acct().prefs.hideNotes?'on':''}"></span></button></div><section class="notes-card soft-card"><h2 class="card-title">${ic('lock')}数据保存在哪里？</h2><p>记录保存在当前设备的浏览器中，不会发送到服务器。两个模拟账号的档案、收藏和历史分别保存。清除浏览器数据可能会移除你新增的记录，建议先导出备份。</p></section></div>`;}
function accountsPage(){return `${header('切换模拟账号')}<div class="page-intro"><p>两个账号，分别记录自己的色彩</p></div><div class="content">${Object.entries(state.accounts).map(([id,a])=>`<button class="account-card ${state.active===id?'active':''}" data-action="switch-account" data-id="${id}" aria-label="切换到${esc(a.name)}"><img class="avatar ${id==='qiao'?'alt':''}" src="${photo('avatar')}" alt="AI生成的模拟用户头像"><div class="account-info"><h2>${esc(a.name)}</h2><p>${a.records.length} 份档案 · ${a.records.filter(r=>r.favorite).length} 条收藏</p></div>${state.active===id?ic('check'):ic('switch')}</button>`).join('')}<p class="account-description">切换后，首页、档案、收藏、浏览历史和草稿会同步切换。<br>这是一组前端模拟账号，不需要注册或提供真实个人信息。</p></div>`;}
const HELP=[['light','为什么要记录拍摄光线？','自然光、暖光和冷白光会改变照片中的颜色观感。记录光线条件，下次比较时尽量选择相近的照片，参考会更清楚。'],['part','手臂试色和上唇试色有什么不同？','手臂与嘴唇的底色、纹理不同，同一产品可能呈现不同效果。建议分别记录，并在购买前优先回看自己的上唇试色。'],['compare','怎样使用并排对比？','在“试色档案”点击“对比多选”，选中 2—4 条记录后开始对比；也可以从单条详情点击“加入对比”。不同光线会用颜色标签提醒，可随时替换比较内容。'],['record','怎样建立一条记录？','进入“新建记录”，选一张 AI 示例照片，填写品牌、系列和色号，再标记状态、光线、试色部位和涂抹方式。可以先存草稿，再确认保存。'],['privacy','我的照片会被公开吗？','不会。本原型没有公开分享功能，所有记录默认私密；数据只保存在当前设备的浏览器里。示例图片并非你本人或真实用户的照片。'],['backup','导出数据后如何使用？','“数据导出”会下载当前账号的 JSON 备份，包含产品信息、笔记、收藏和历史。示例图片通过名称引用；本单文件已包含整套图片。微信若限制下载，可复制备份文本或在系统浏览器中打开。']];
let openHelp='';
function helpPage(){return `${header('帮助与反馈')}<section class="help-hero">${ic('help')}<h2>每一次试色，<br>都可以记录得更清楚</h2><p>用简单的操作，留下一份自己的唇妆参考。</p></section><div class="content">${HELP.map(([id,q,a])=>`<section class="help-item${openHelp===id?' open':''}"><button class="help-question" data-action="toggle-help" data-id="${id}" aria-expanded="${openHelp===id}">${q}${ic('down')}</button><p class="help-answer">${a}</p></section>`).join('')}<form id="feedbackForm" class="feedback-card soft-card"><h2>把你的建议告诉试色记</h2><p>可以写下不方便的地方，或希望增加的功能。演示反馈只保存在本机，不会发送到外部。</p><textarea class="note-input" name="feedback" maxlength="500" required aria-label="反馈内容" placeholder="例如：想让对比时的光线提醒更明显…"></textarea><button class="primary full" type="submit">记录反馈</button></form></div>`;}
function exportPage(){const n=records().length;return `${header('数据导出')}<div class="content"><div class="privacy-intro"><div class="privacy-emblem">${ic('download')}</div><h2>给自己的色彩留份备份</h2><p>仅导出当前账号的数据，<br>由你自己保存和管理。</p></div><div class="export-meta">当前账号：${esc(acct().name)}<br>${n} 份档案 · ${records().filter(r=>r.favorite).length} 条收藏<br>包含品牌、色号、拍摄条件、笔记和浏览历史。</div><button class="primary full" data-action="download-export">${ic('download')}下载 JSON 备份</button><button class="secondary full" style="margin-top:12px" data-action="show-export">${ic('copy')}查看与复制备份文本</button><p class="account-description">若微信浏览器未弹出下载，可查看并复制备份文本，或用手机系统浏览器打开本页。AI 示例图片已内嵌在这个 HTML 文件中，备份使用图片名称引用。</p></div>`;}
function loginPage(){return `${header('账户已退出')}<div class="login-intro">${ic('lipstick')}<h2>欢迎回到试色记</h2><p>已退出当前模拟账号。<br>你的本机档案仍然保留，可以继续体验。</p><button class="primary full" data-action="login-current">重新体验当前账号</button><button class="secondary full" data-route="/accounts">选择另一个模拟账号</button></div>`;}
function missingPage(){return `${header('未找到试色记录')}<div class="content">${empty('这条记录不在当前账号中','切换账号后，请从自己的档案列表重新选择。','return-archives','返回档案列表')}</div>`;}
function render(direction='forward',preserve=false){
 const stage=document.getElementById('stage');const old=activeScreen();if(old){routeScroll[current]=old.scrollTop;old.setAttribute('aria-hidden','true');old.inert=true;old.className='screen '+(direction==='back'?'leaving-back':'leaving');setTimeout(()=>old.remove(),230);}
 const route=currentRoute();let html;let title='首页';const id=route.split('/')[2];
 if(!acct().loggedIn&&route!='/accounts'){html=loginPage();title='账户已退出';}
 else if(route==='/home'){html=homePage();title='首页';}
 else if(route==='/archives'){html=archivePage();title='试色档案';}
 else if(route==='/compare/select'){html=archivePage(true);title='选择对比档案';}
 else if(route==='/compare'){html=comparePage();title='并排试色对比';}
 else if(route.startsWith('/detail/')){html=detailPage(byId(id));title='试色详情';}
 else if(route==='/new'||route.startsWith('/edit/')){html=newPage(route.startsWith('/edit/')?id:null);title=route==='/new'?'新建记录':'编辑试色记录';}
 else if(route==='/me'){html=mePage();title='我的';}
 else if(route==='/favorites'||route==='/history'){html=collectionPage(route.slice(1));title=route==='/favorites'?'我的收藏':'浏览记录';}
 else if(route==='/settings'){html=settingsPage();title='账号设置';}
 else if(route==='/privacy'){html=privacyPage();title='隐私设置';}
 else if(route==='/accounts'){html=accountsPage();title='切换模拟账号';}
 else if(route==='/help'){html=helpPage();title='帮助与反馈';}
 else if(route==='/export'){html=exportPage();title='数据导出';}
 else{html=missingPage();title='未找到页面';}
 const screen=document.createElement('div');screen.dataset.page=route;screen.className='screen '+(direction==='none'?'':direction);if((route==='/archives'&&selecting)||route==='/compare/select')screen.classList.add('has-selection');screen.innerHTML=html;const compareGrid=screen.querySelector('.compare-grid');if(compareGrid)compareGrid.style.setProperty('--columns',String(selected.length));stage.appendChild(screen);current=route;document.title=title+' · 试色记';renderTabs();renderSelectionBar();
 requestAnimationFrame(()=>{screen.scrollTop=preserve?(routeScroll[route]||0):(routeScroll[route]||0);});
 if(route==='/new'||route.startsWith('/edit/'))checkDuplicate();
}
function routeChanged(){const route=currentRoute();let direction=pendingDirection;if(trail.length>1&&trail[trail.length-2]===route){trail.pop();direction='back';}else if(trail[trail.length-1]!==route)trail.push(route);pendingDirection='forward';if(route.startsWith('/detail/')&&acct().loggedIn){const id=route.split('/')[2];if(byId(id)){acct().history=acct().history.filter(h=>h.id!==id);acct().history.unshift({id,time:new Date().toISOString()});acct().history=acct().history.slice(0,40);persist();}}render(direction);}
function renderSelectionBar(){const bar=document.getElementById('selectionBar');const route=currentRoute();if(!acct().loggedIn||!((route==='/archives'&&selecting)||route==='/compare/select')){bar.innerHTML='';return;}bar.innerHTML=`<div class="selectionbar"><div><p>已选 <strong>${selected.length}</strong> / 4 条记录</p><button class="tiny-button" data-action="clear-selection">清空选择</button></div><button class="primary" data-action="confirm-compare" ${selected.length<2?'disabled':''}>${route==='/compare/select'?'确认对比':'开始对比'}</button></div>`;}
function redrawArchiveGrid(){const screen=activeScreen();const grid=screen&&screen.querySelector('#recordGrid');if(!grid)return;const picker=currentRoute()==='/compare/select';const list=picker?sortedRecords():filteredRecords();grid.innerHTML=list.length?list.map(r=>recordCard(r,picker||selecting)).join(''):empty('暂时没有符合的试色','换个关键词，或重置筛选再看看。');const count=screen.querySelector('#archiveCount');if(count)count.textContent=list.length;renderSelectionBar();}
function captureForm(){const form=activeScreen()?.querySelector('#recordForm');if(form&&form.dataset.submitted!=='true'&&acct().prefs.rememberForm){formTemp[state.active+':'+(form.dataset.id||'new')]=readForm(form);}}
function readForm(form){const data=new FormData(form);return {brand:String(data.get('brand')||'').trim(),series:String(data.get('series')||'').trim(),shade:String(data.get('shade')||'').trim(),status:String(data.get('status')),light:String(data.get('light')),part:String(data.get('part')),finish:String(data.get('finish')),image:String(data.get('image')),notes:String(data.get('notes')||'').trim()};}
function checkDuplicate(){const form=activeScreen()?.querySelector('#recordForm');if(!form)return;const v=readForm(form);const found=records().find(r=>r.id!==form.dataset.id&&r.brand.toLowerCase()===v.brand.toLowerCase()&&r.series.toLowerCase()===v.series.toLowerCase()&&r.shade.toLowerCase()===v.shade.toLowerCase());const note=form.querySelector('#duplicateTip');note.classList.toggle('visible',!!found);note.innerHTML=found?`你已经记录过这个品牌、系列和色号，可先回看已有档案。<button type="button" class="text-link" data-action="open-record" data-id="${found.id}">查看已有记录</button>`:'';}
let modalReturnFocus=null;
function closeModal(){document.getElementById('modalRoot').innerHTML='';const s=activeScreen();if(s)s.inert=false;document.getElementById('tabbar').inert=false;if(modalReturnFocus&&document.contains(modalReturnFocus))modalReturnFocus.focus({preventScroll:true});modalReturnFocus=null;}
function showSheet(title,body,actions=''){modalReturnFocus=document.activeElement;const root=document.getElementById('modalRoot');root.innerHTML=`<div class="modal-layer" data-modal-backdrop><section class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"><div class="sheet-handle"></div><header class="sheet-header"><h2 id="sheetTitle">${title}</h2><button class="icon-btn" data-action="close-modal" aria-label="关闭弹窗">${ic('close')}</button></header><div class="sheet-body">${body}</div>${actions?`<div class="sheet-actions">${actions}</div>`:''}</section></div>`;const s=activeScreen();if(s)s.inert=true;document.getElementById('tabbar').inert=true;root.querySelector('button,textarea,input')?.focus({preventScroll:true});}
function infoSheet(title,body){showSheet(title,`<p>${body}</p>`,`<button class="primary" data-action="close-modal">知道了</button>`);}
function exportData(){return JSON.stringify({app:'试色记',version:'2.0',kind:'前端模拟数据备份',exportedAt:new Date().toISOString(),account:{id:state.active,name:acct().name},records:records(),history:acct().history,privacy:'仅自己可见，示例图片以图片名称引用'},null,2);}
function toggleSelection(id){if(selected.includes(id))selected=selected.filter(v=>v!==id);else if(selected.length>=4){toast('最多同时对比 4 条试色记录');return;}else selected.push(id);redrawArchiveGrid();}
function openRecord(id){if(!byId(id)){toast('这条记录不在当前账号中');return;}navigate('/detail/'+id);}
function showFilter(type){const isPart=type==='part';const values=isPart?['全部部位','上唇','手臂']:['全部光线','自然光','室内暖光','冷白光'];const key=isPart?'part':'light';showSheet(isPart?'选择试色部位':'选择拍摄光线',values.map(v=>`<button class="sheet-choice ${filters[key]===v?'active':''}" data-action="set-filter" data-key="${key}" data-value="${v}"><span>${v}</span>${filters[key]===v?ic('check'):''}</button>`).join(''));}
document.addEventListener('click',event=>{
 const backdrop=event.target.closest('[data-modal-backdrop]');if(backdrop&&event.target===backdrop){closeModal();return;}
 const routeTarget=event.target.closest('[data-route]');if(routeTarget){closeModal();navigate(routeTarget.dataset.route);return;}
 const b=event.target.closest('[data-action]');if(!b||b.disabled)return;const action=b.dataset.action;const id=b.dataset.id;
 if(action==='back'){goBack();return;}
 if(action==='close-modal'){closeModal();return;}
 if(action==='open-record'){closeModal();openRecord(id);return;}
 if(action==='notifications'){state.notificationsRead=true;persist();activeScreen()?.querySelector('.unread-dot')?.remove();showSheet('小小提醒',`<button class="notice-item" data-route="/privacy">${ic('shield')}<span><h3>你的档案默认私密</h3><p>这里只收藏自己的试色，没有公开分享流。</p></span></button><button class="notice-item" data-action="help-topic" data-topic="light">${ic('sun')}<span><h3>拍照前，先看看光线</h3><p>给记录标记光线，下次比较更清楚。</p></span></button>`);return;}
 if(action==='toggle-selection'){selecting=!selecting;render('none',true);return;}
 if(action==='start-selection'){selected=[];selecting=true;navigate('/archives');return;}
 if(action==='select-record'){toggleSelection(id);return;}
 if(action==='clear-selection'){selected=[];redrawArchiveGrid();return;}
 if(action==='confirm-compare'){if(selected.length<2){toast('请至少选择 2 条记录');return;}navigate('/compare');return;}
 if(action==='return-archives'){closeModal();selecting=false;navigate('/archives');return;}
 if(action==='filter-status'){filters.status=b.dataset.value;render('none',true);return;}
 if(action==='filter-part'||action==='filter-light'){showFilter(action==='filter-part'?'part':'light');return;}
 if(action==='set-filter'){filters[b.dataset.key]=b.dataset.value;closeModal();render('none',true);return;}
 if(action==='clear-filters'){Object.assign(filters,{query:'',status:'全部',part:'全部部位',light:'全部光线'});render('none',true);return;}
 if(action==='favorite'){const r=byId(id);if(!r)return;r.favorite=!r.favorite;persist();render('none',true);toast(r.favorite?'已加入我的收藏':'已取消收藏');return;}
 if(action==='compare-record'){selected=selected.filter(x=>byId(x)&&x!==id).slice(0,3);selected.unshift(id);ensureCompare();navigate('/compare');return;}
 if(action==='form-choice'){const form=b.closest('form');form.elements[b.dataset.name].value=b.dataset.value;b.closest('.choice-row').querySelectorAll('button').forEach(e=>e.setAttribute('aria-pressed',String(e===b)));captureForm();return;}
 if(action==='choose-photo'){captureForm();const v=readForm(activeScreen().querySelector('#recordForm'));showSheet('选择一张示例试色照片',`<p>以下图片均为 AI 生成，仅用于原型演示。</p><div class="gallery-grid">${gallery.map(([key,label])=>`<button class="gallery-option ${key===v.image?'active':''}" data-action="set-photo" data-value="${key}" aria-label="${label}"><img src="${photo(key)}" alt="${label}AI示例"><span>${label}</span></button>`).join('')}</div>`);return;}
 if(action==='set-photo'){const key=b.dataset.value;closeModal();const form=activeScreen().querySelector('#recordForm');form.elements.image.value=key;form.querySelector('#formPhoto').src=photo(key);const part=key.startsWith('arm_')?'手臂':'上唇';form.elements.part.value=part;form.querySelectorAll('[data-name=part]').forEach(e=>e.setAttribute('aria-pressed',String(e.dataset.value===part)));captureForm();return;}
 if(action==='save-draft'){const form=activeScreen().querySelector('#recordForm');acct().draft=readForm(form);persist();captureForm();toast('草稿已保存到当前账号');return;}
 if(action==='discard-draft'){acct().draft=null;delete formTemp[state.active+':new'];persist();render('none',true);toast('已开始一份新记录');return;}
 if(action==='toggle-pref'){const key=b.dataset.key;if(!['hideNotes','rememberForm'].includes(key))return;acct().prefs[key]=!acct().prefs[key];if(key==='rememberForm'&&!acct().prefs[key]){Object.keys(formTemp).filter(k=>k.startsWith(state.active+':')).forEach(k=>delete formTemp[k]);}persist();render('none',true);return;}
 if(action==='edit-name'){showSheet('修改昵称',`<label for="nicknameInput">给自己的色彩档案起个名字</label><input id="nicknameInput" class="nickname-input" style="margin-top:12px" maxlength="12" value="${esc(acct().name)}" aria-label="新昵称">`,`<button class="secondary" data-action="close-modal">取消</button><button class="primary" data-action="save-name">保存</button>`);return;}
 if(action==='save-name'){const value=document.getElementById('nicknameInput').value.trim();if(!value){toast('请输入昵称');return;}acct().name=value;persist();closeModal();render('none',true);toast('昵称已更新');return;}
 if(action==='open-accounts'){navigate('/accounts');return;}
 if(action==='avatar-info'){infoSheet('AI 示例头像','这个头像由 AI 生成，用于课程原型演示，不代表真实用户。');return;}
 if(action==='about'){infoSheet('关于试色记','试色记——个人美妆试色档案工具。专注口红、唇釉的个人记录、检索与并排比较。当前为单文件手机交互原型，示例图片与品牌信息仅用于演示。');return;}
 if(action==='storage-info'){infoSheet('数据保存在本机','新增记录、草稿、收藏和浏览历史保存在当前浏览器。切换设备或清除浏览器数据后不会自动同步，建议先使用“数据导出”备份。');return;}
 if(action==='private-info'){infoSheet('仅自己可见','所有档案都保持私密，本原型不提供公开分享入口，也不会把记录发送到服务器。');return;}
 if(action==='switch-account'){if(!state.accounts[id])return;if(state.active===id&&acct().loggedIn){toast('当前正在使用这个账号');return;}captureForm();state.active=id;acct().loggedIn=true;selected=[];selecting=false;Object.assign(filters,{query:'',status:'全部',part:'全部部位',light:'全部光线'});routeScroll={};persist();closeModal();navigate('/me',true);toast('已切换到 '+acct().name);return;}
 if(action==='logout'){showSheet('退出当前模拟账号？','<p>退出后会保留这个账号的本机档案，你可以随时重新体验。</p>',`<button class="secondary" data-action="close-modal">继续使用</button><button class="primary" data-action="confirm-logout">确认退出</button>`);return;}
 if(action==='confirm-logout'){acct().loggedIn=false;persist();closeModal();navigate('/login',true);toast('已退出当前模拟账号');return;}
 if(action==='login-current'){acct().loggedIn=true;persist();navigate('/home',true);toast('欢迎回来，'+acct().name);return;}
 if(action==='help-topic'){closeModal();openHelp=b.dataset.topic;navigate('/help');return;}
 if(action==='toggle-help'){openHelp=openHelp===id?'':id;const parent=b.closest('.help-item');activeScreen().querySelectorAll('.help-item').forEach(e=>{const open=e===parent&&openHelp===id;e.classList.toggle('open',open);e.querySelector('button').setAttribute('aria-expanded',String(open));});return;}
 if(action==='download-export'){const data=exportData();try{const blob=new Blob([data],{type:'application/json;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`试色记_${acct().name}_档案备份.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);toast('已发起下载，也可查看并复制备份');}catch(e){infoSheet('当前浏览器未支持下载','请使用下方“查看与复制备份文本”，或在手机系统浏览器中打开。');}return;}
 if(action==='show-export'){showSheet('你的档案备份',`<p>下面是当前账号的 JSON 备份文本，可全选复制保存。</p><textarea class="export-box" id="exportText" readonly aria-label="档案备份文本">${esc(exportData())}</textarea>`,`<button class="primary" data-action="copy-export">${ic('copy')}复制备份文本</button>`);return;}
 if(action==='copy-export'){const t=document.getElementById('exportText');const fallback=()=>{t.focus();t.select();try{if(document.execCommand('copy'))toast('备份文本已复制');else toast('请长按文本，选择全选并复制');}catch(e){toast('请长按文本，选择全选并复制');}};if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t.value).then(()=>toast('备份文本已复制')).catch(fallback);else fallback();return;}
});
document.addEventListener('submit',event=>{
 if(event.target.id==='homeSearch'){event.preventDefault();filters.query=event.target.elements.query.value;filters.status='全部';filters.part='全部部位';filters.light='全部光线';navigate('/archives');return;}
 if(event.target.id==='recordForm'){event.preventDefault();const form=event.target;const v=readForm(form);if(!v.brand||!v.shade){toast('请填写品牌和色号名称');form.elements[!v.brand?'brand':'shade'].focus();return;}const id=form.dataset.id;const now=new Date().toISOString();let r=id?byId(id):null;if(r){Object.assign(r,v,{series:v.series||'未填写系列',updated:now});}else{r={...v,series:v.series||'未填写系列',id:'n'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),created:now,updated:now,favorite:false};records().unshift(r);}acct().draft=null;delete formTemp[state.active+':'+(id||'new')];persist();form.dataset.submitted='true';navigate('/detail/'+r.id);setTimeout(()=>{showSheet(id?'修改已保存':'保存成功',`<div class="success-mark">${ic('check')}</div><p class="center">${esc(r.shade)}<br>已存入你的私密试色档案。</p>`,`<button class="primary" data-action="close-modal">查看试色详情</button>`);},260);return;}
 if(event.target.id==='feedbackForm'){event.preventDefault();const text=event.target.elements.feedback.value.trim();if(!text){toast('先写一点建议吧');return;}acct().feedback.push({text,time:new Date().toISOString()});persist();event.target.reset();infoSheet('反馈已记录','这条建议已保存在当前账号的本机演示数据中，没有向外部发送。谢谢你帮助试色记变得更好。');}
});
document.addEventListener('input',event=>{if(event.target.id==='archiveSearch'){filters.query=event.target.value;redrawArchiveGrid();}if(event.target.closest('#recordForm')){checkDuplicate();captureForm();}});
document.addEventListener('keydown',event=>{const modal=document.querySelector('#modalRoot .sheet');if(!modal)return;if(event.key==='Escape'){closeModal();return;}if(event.key==='Tab'){const list=[...modal.querySelectorAll('button,input,textarea,a[href]')].filter(e=>!e.disabled);const first=list[0],last=list[list.length-1];if(event.shiftKey&&document.activeElement===first){event.preventDefault();last?.focus();}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first?.focus();}}});
window.addEventListener('hashchange',routeChanged);
window.addEventListener('beforeunload',captureForm);
trail=[currentRoute()];routeChanged();persist();
if(memoryOnly)setTimeout(()=>toast('当前浏览器限制本地保存，本次仍可继续演示'),800);
</script>
